name: Autonomous Daily Software Factory

on:
  schedule:
    # 03:00 UTC = 08:30 IST
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-software-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install factory dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run autonomous factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.7-flash
        run: python agent.py

      - name: Show run report
        if: always()
        run: |
          if [ -f TODAY_OUTPUT.md ]; then cat TODAY_OUTPUT.md; fi

      - name: Commit validated release
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No repository changes to publish."
            exit 0
          fi

          git config user.name "Autonomous Factory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(daily): autonomous validated release $(date -u +'%Y-%m-%d') [skip ci]"
          git push origin HEAD:main
